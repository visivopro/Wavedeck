<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wavedeck — Visualization</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 12px; bottom: 10px; right: 12px; display: flex; gap: 10px; align-items: center; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 3px #000; pointer-events: none; }
  body.hud #hud { opacity: 1; }
  #name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #keys { color: rgba(255,255,255,.6); font-size: 11px; }
  #now { position: fixed; left: 14px; top: 12px; font-size: 14px; opacity: 0; transition: opacity .6s; text-shadow: 0 1px 4px #000; }
  #now.show { opacity: .95; }
</style>
<script src="vendor/butterchurn.min.js"></script>
<script src="vendor/butterchurnPresets.min.js"></script>
<script src="vendor/butterchurnPresetsExtra.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="now"></div>
<div id="hud"><span id="name"></span><span id="keys">Space next · Backspace back · R random cycle · F fullscreen · Esc exit fullscreen</span></div>
<script>
(() => {
  const P = () => window.opener && window.opener.wavedeckPlayer;
  const bc = window.butterchurn.default || window.butterchurn;
  const packs = [window.butterchurnPresets, window.butterchurnPresetsExtra].filter(Boolean).map((p) => (p.default || p));
  const presets = {};
  for (const p of packs) Object.assign(presets, p.getPresets());
  const names = Object.keys(presets).sort((a, b) => a.localeCompare(b));
  const canvas = document.getElementById('c');
  if (!document.createElement('canvas').getContext('webgl2')) {
    document.body.innerHTML = '<div style="height:100%;display:grid;place-items:center;text-align:center;color:#9aa3b8;padding:30px">The visualization window needs WebGL 2.<br>Update your graphics driver, or turn on hardware acceleration in your graphics settings.</div>';
    return;
  }
  const ctx = new AudioContext();
  let hudT;
  let vis, idx = 0, history = [], cycle = true, lastSwitch = performance.now();
  const saved = (() => { try { return JSON.parse(localStorage.getItem('wavedeck-md') || '{}'); } catch { return {}; } })();
  if (saved.preset && names.includes(saved.preset)) idx = names.indexOf(saved.preset); else idx = Math.floor(Math.random() * names.length);
  if (saved.cycle === false) cycle = false;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    canvas.width = w; canvas.height = h;
    if (vis) vis.setRendererSize(w, h);
  }
  size();
  vis = bc.createVisualizer(ctx, canvas, { width: canvas.width, height: canvas.height, pixelRatio: 1, textureRatio: 1 });
  function load(i, blend = 2.0) {
    idx = (i + names.length) % names.length;
    vis.loadPreset(presets[names[idx]], blend);
    document.getElementById('name').textContent = `${idx + 1}/${names.length}  ${names[idx]}${cycle ? '  ·  cycling' : ''}`;
    try { localStorage.setItem('wavedeck-md', JSON.stringify({ preset: names[idx], cycle })); } catch {}
    lastSwitch = performance.now();
    flashHud();
  }
  function next() { history.push(idx); load(Math.floor(Math.random() * names.length)); }
  function prev() { if (history.length) load(history.pop()); }
  load(idx, 0);

  function flashHud() { document.body.classList.add('hud'); clearTimeout(hudT); hudT = setTimeout(() => document.body.classList.remove('hud'), 2500); }
  addEventListener('mousemove', flashHud);
  addEventListener('resize', size);
  canvas.addEventListener('click', next);
  canvas.addEventListener('dblclick', () => window.wavedeck.win.fullscreen());
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'n') { e.preventDefault(); next(); }
    else if (k === 'backspace' || k === 'p') prev();
    else if (k === 'r') { cycle = !cycle; load(idx, 0.5); }
    else if (k === 'f' || (k === 'enter' && e.altKey)) window.wavedeck.win.fullscreen();
    else if (k === 'escape') { if (document.fullscreenElement || innerHeight === screen.height) window.wavedeck.win.fullscreen(); }
    else if (P() && 'zxcvb'.includes(k)) P().control({ z: 'prev', x: 'play', c: 'pause', v: 'stop', b: 'next' }[k]);
  });

  // Track title overlay on song change
  let lastTitle = '';
  const silence = new Uint8Array(1024).fill(128);
  function frame() {
    const p = P();
    let levels = null;
    try { if (p && p.getState().status === 'playing') levels = p.levels(); } catch {}
    vis.render({ audioLevels: levels || { timeByteArray: silence, timeByteArrayL: silence, timeByteArrayR: silence } });
    if (cycle && performance.now() - lastSwitch > 20000) next();
    try {
      const t = p && p.getCurrent();
      const title = t ? t.displayTitle : '';
      if (title !== lastTitle) { lastTitle = title; const n = document.getElementById('now'); n.textContent = title; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 4000); }
    } catch {}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
